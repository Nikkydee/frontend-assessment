name: Playwright Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
      branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # Credentials and test data come from repository secrets, never the repo.
    # The tests read these via process.env (see Utils/helperMethods.ts#getEnv).
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      USER_EMAIL: ${{ secrets.USER_EMAIL }}
      USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
      OTP_CODE: ${{ secrets.OTP_CODE }}
      TRANSACTION_PIN: ${{ secrets.TRANSACTION_PIN }}
      BENEFICIARY_BANK: ${{ secrets.BENEFICIARY_BANK }}
      BENEFICIARY_ACCOUNT: ${{ secrets.BENEFICIARY_ACCOUNT }}
      TRANSFER_AMOUNT: ${{ secrets.TRANSFER_AMOUNT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Allure
        run: npm install -g allure-commandline@2.30.0

      - name: Run Playwright tests
        run: npm test

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run test:report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: reports/
          retention-days: 30

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
